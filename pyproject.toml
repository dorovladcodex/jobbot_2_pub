[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobbot-pub"
version = "0.1.0"
description = "Evidence-backed job matching with a reviewable LangGraph workflow"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pypdf>=5,<8",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["jobbot*"]
